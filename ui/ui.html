<!doctype html>
<html><head><meta charset="utf-8">
<!-- Atticus overlay. Atticus.app loads this, puts orbs.js in place of the marker below, and calls window.ui.* -->
<style>
  :root { color-scheme: dark; --fg2: #c7c7cc; --accent: #006bd6; --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
  html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; cursor: default;
    font: 13px -apple-system, system-ui, sans-serif; color: #f5f5f7; -webkit-font-smoothing: antialiased; }
  html { background: transparent; }   /* native glass tint sits below the live window layer */
  #card { padding: 14px 20px 18px; animation: pop .42s var(--spring) both; box-sizing: border-box;
    display: flex; flex-direction: column; max-height: var(--screen-height, 10000px); }
  #card.again { animation: none; }
  #card.held { box-sizing: border-box; display: flex; flex-direction: column; }   /* dragged to a height: keep it */
  #card.held #comp { margin-top: auto; } #card.held #thread { margin-bottom: 14px; }

  #fold { flex: none; width: 26px; height: 18px; padding: 0; border: 0; border-radius: 9px; display: grid; place-items: center; cursor: pointer;
    background: none; color: var(--fg2); }
  #fold:is(:hover,.hot) { color: #f5f5f7; }
  #fold svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #fold:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.folded #card { padding: 6px 20px; min-height: 0 !important; }
  body.fold-morph #card { transition: padding .25s var(--ease); }
  body.fold-morph.fold-away #card { padding: 6px 20px; min-height: 0 !important; }
  body.fold-morph #card > :not(#head) { opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
  body.folded:not(.fold-morph) :is(#thread, #comp, #pointbar, #mode, #agents-pill, .e, #grip) { display: none !important; }
  body.folded #fold { opacity: 0; pointer-events: none; }
  body.folded:is(:hover,.hot) #fold, body.folded #fold:focus-visible { opacity: 1; pointer-events: auto; }
  body.folded #status span:empty::before { content: 'Done'; }

  #head { display: flex; align-items: center; gap: 7px; height: 44px; flex: none; }
  canvas { width: 44px; height: 44px; flex: none; margin-left: -4px; transition: transform .35s var(--ease); }
  #status { flex: 1 0 64px; min-width: 64px; font-size: 12.5px; line-height: 22px; color: var(--fg2); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .elapsed { display: flex; align-items: baseline; gap: 6px; margin-top: 16px; color: var(--fg2); font-size: 10.5px; line-height: 16px; animation: in .25s var(--ease) both; }
  .elapsed .hf { margin-left: 8px; }
  .elapsed .hf i { font-style: normal; animation: hfdot 1.4s infinite both; } .elapsed .hf i:nth-child(2) { animation-delay: .2s; } .elapsed .hf i:nth-child(3) { animation-delay: .4s; }
  @keyframes hfdot { 0% { opacity: 0; } 25%, 60% { opacity: 1; } 85%, 100% { opacity: 0; } }   /* hands-free: dots fade in one by one, then out */
  .elapsed .redo { margin-left: auto; padding: 0; border: 0; background: none; font: 500 11px -apple-system, system-ui, sans-serif; color: var(--fg2); cursor: pointer; transition: color .2s; }
  .elapsed .redo:is(:hover,.hot) { color: #f5f5f7; }
  .elapsed b { color: var(--fg2); font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #status span { display: inline-block; max-width: 100%; vertical-align: top; overflow: hidden; text-overflow: ellipsis; animation: in .35s var(--ease) both; }
  #status.live span { background: linear-gradient(90deg, var(--fg2) 0%, #fff 45%, var(--fg2) 90%); background-size: 200% 100%;
    -webkit-background-clip: text; color: transparent; animation: in .35s var(--ease) both, shimmer 1.5s linear infinite; }

  /* Automatic following must be immediate: repeated live updates keep restarting a smooth scroll below the current turn. */
  #thread { container-type: inline-size; max-height: 420px; min-height: 0; overflow-y: auto; padding-top: 2px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%); }
  #thread::-webkit-scrollbar { width: 0; }
  #thread:empty { display: none; }
  .turn { padding-top: 12px; animation: in .4s var(--ease) both; transition: opacity .4s var(--ease); }
  .turn + .turn { margin-top: 18px; padding-top: 18px; border-top: .5px solid rgba(255,255,255,.08); }
  .turn.old .a { color: var(--fg2); }

  .q { margin-left: auto; width: fit-content; max-width: 80%; padding: 9px 14px; border-radius: 16px 16px 5px 16px;
    background: rgba(255,255,255,.09); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12);
    font-size: 13.5px; line-height: 1.45; color: #e5e5ea; overflow-wrap: anywhere; cursor: pointer;
    transition: font-size .3s var(--ease), color .3s; }
  .q.live { font-size: 15px; color: #fff; }
  .q.live::after { content: ""; display: inline-block; width: 1.5px; height: 1em; margin-left: 2px; vertical-align: -2px;
    background: #fff; animation: blink 1s steps(1) infinite; }
  .shot { display: block; margin: 0 0 4px auto; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: none; cursor: zoom-in;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); }   /* the marked crop, sent with this ask */
  .shot img { display: block; max-width: 120px; max-height: 72px; transition: max-width .3s var(--ease), max-height .3s var(--ease); }
  .shot.big { max-width: 86%; cursor: zoom-out; } .shot.big img { max-width: 100%; max-height: 220px; }
  .q.empty:not(.hear) { display: none; }
  .q.empty.hear { color: var(--fg2); } .q.empty.hear::before { content: "Listening…"; }   /* voice: the bubble waits for words */
  .q.reply { margin-top: 14px; }   /* a spoken answer to a choices card, in the card's place */
  /* dictation: a pill just wide enough for the orb and its wave (and the lock once locked). Released, it folds into a circle with
     the working orb, then the orb and a green check; a message (nothing to insert into, an error) is one short line. No transcript, no
     dividers. The panel takes #card's size (fit) and animates to it, so each state morphs into the next */
  body.dictate #card { flex-direction: row; align-items: center; justify-content: center; gap: 8px; width: max-content; min-width: 36px; min-height: 36px; margin: 0 auto; padding: 0 12px 0 4px; }
  body.dictate:is(.finishing, .done) #card { padding: 0 4px; }
  body.dictate.said #card { padding: 4px 16px 4px 4px; }
  body.dictate #head { height: auto; } body.dictate #head > :not(#orb), body.dictate :is(#thread, #comp, #pointbar, .e, #grip) { display: none; }
  body.dictate #orb { width: 28px; height: 28px; margin: 0; animation: morph .3s var(--ease) both; }
  #dictwave { display: none; }
  body.dictate.hearing #dictwave { display: flex; align-items: center; gap: 2px; width: 43px; height: 28px; flex: none; }
  #dictwave i { display: block; width: 3px; height: 3px; border-radius: 3px; background: var(--accent); transition: height .1s var(--ease); }
  #check { display: none; }
  body.dictate.done #check { display: block; position: relative; flex: none; width: 28px; height: 28px; animation: morph .35s var(--spring) both; }
  body.dictate.done #check::before { content: ""; position: absolute; left: 8px; top: 8px; width: 12px; height: 6px; border-left: 2px solid #30d158; border-bottom: 2px solid #30d158; border-radius: 1px; transform: rotate(-45deg); }
  #lock { display: none; flex: none; width: 10px; height: 13px; color: var(--fg2); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  #lock rect { fill: currentColor; stroke: none; }
  body.dictate.locked #lock { display: block; animation: in .25s var(--ease) both; }
  /* locked (double tap): the whole pill wears an orange ring; the panel's 18px corners clip it to the pill */
  body.dictate::after { content: ""; position: fixed; inset: 0; border-radius: 18px; pointer-events: none; opacity: 0; transition: opacity .3s var(--ease);
    box-shadow: inset 0 0 0 1.5px rgba(255,159,10,.9), inset 0 0 12px rgba(255,159,10,.35); }
  body.dictate.locked::after { opacity: 1; }
  .dn { display: none; }
  body.dictate .dn { display: block; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* not shown, still read out ("Cleaning up…", "Inserted") */
  body.dictate.said .dn { display: flex; position: static; align-items: center; gap: 6px; width: auto; height: auto; max-width: 290px; overflow: visible; clip-path: none; white-space: normal;
    font-size: 12px; line-height: 16px; color: #f5f5f7; animation: fade .25s var(--ease) both; }
  .dn button { border:0; border-radius:6px; padding:3px 8px; font:inherit; color:var(--fg2); background:none; text-decoration:underline; cursor:pointer; flex:none; }
  .dn button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .dn .idea { padding:0; color:inherit; text-decoration:none; text-align:left; } .dn .ideax { display:grid; place-items:center; width:20px; height:20px; padding:0; }
  .dn .ideax svg { width:8px; height:8px; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .dn.tick { animation: in .25s var(--ease) both; }
  .dn.tick::before { content: ""; flex: none; width: 8px; height: 4px; border-left: 1.5px solid #30d158; border-bottom: 1.5px solid #30d158; transform: translateY(-1px) rotate(-45deg); }

  .steps { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .steps:empty { display: none; }
  .steps[data-more]::before { content: "+" attr(data-more) " earlier"; font-size: 11px; color: var(--fg2); padding-left: 12px; }
  .step { font-size: 12px; line-height: 16px; color: var(--fg2); display: flex; gap: 7px; align-items: center; white-space: nowrap;
    overflow: hidden; animation: in .35s var(--ease) both; }
  .step::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: #636366;
    transition: background .3s; }
  .step span { overflow: hidden; text-overflow: ellipsis; }
  .step.live { color: #f5f5f7; }
  .step.live::before { background: #fff; animation: pulse 1s ease-in-out infinite; }
  .step.done::before { background: #30d158; }
  /* The mini's picture is drawn under this see-through page, so nothing may sit or scroll over it: the mini is not sticky and the
     steps stay in flow below it, clipped to their own box. Three 16px rows tall, so adding steps never moves the mini; older rows slide out the top. */
  .turn.preview .steps { height: 56px; margin-top: 6px; gap: 4px; justify-content: flex-end; overflow: clip;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 20px); }
  .turn.preview .steps[data-more]::before { content: none; }
  .turn.preview .step { flex: none; animation: none; }

  .mini { display: grid; grid-template-rows: 0fr; margin-top: 0; opacity: 0; transform: translateY(6px) scale(.96);
    transform-origin: top left; transition: grid-template-rows .42s var(--ease), margin .42s var(--ease), opacity .24s, transform .42s var(--spring); }
  .mini.on { grid-template-rows: 1fr; margin-top: 10px; opacity: 1; transform: none; }
  .mini-inner { min-height: 0; overflow: hidden; padding: 0 4px; margin-left: -4px; }
  .mini-view { position: relative; display: block; padding: 0; width: 100%; height: calc((100cqw - 4px) * .625); border: 0;   /* 16:10 of its width (4px: .mini-inner's inset). Not aspect-ratio: WebKit then keeps the mini's row at its old height when the box widens, so the picture covers the steps */
    border-radius: 12px; background: transparent; overflow: hidden; cursor: pointer; color: #f5f5f7;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.28); transition: box-shadow .24s; }
  .mini-view:is(:hover,.hot) { box-shadow: inset 0 0 0 1px rgba(255,255,255,.3), 0 10px 28px rgba(0,0,0,.36); }   /* no scale: the native picture under it can't follow */
  .mini-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.07), transparent 70%), rgba(18,18,20,.96); transition: opacity .3s; }
  .mini-fallback::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%);
    animation: sweep 1.8s linear infinite; will-change: transform; }   /* first frame on its way; transform, not background-position, so the GPU moves it without repaints */
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .mini.live .mini-fallback { opacity: 0; pointer-events: none; }
  .mini-fallback img { width: 34px; height: 34px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
  .mini-title { max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px -apple-system, system-ui; color: var(--fg2); }
  .mini-tag, .mini-hint { position: absolute; top: 8px; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; box-sizing: border-box;
    border-radius: 11px; font: 500 11px -apple-system, system-ui; color: #f5f5f7; background: rgba(20,20,22,.72);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14), 0 2px 8px rgba(0,0,0,.3); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .mini-tag { left: 8px; max-width: calc(100% - 90px); }
  .mini-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-tag i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: #0a84ff; box-shadow: 0 0 6px #0a84ff; animation: pulse 1.2s ease-in-out infinite; }
  .mini.done .mini-tag i { width: 8px; height: 4px; border-radius: 0; background: none; box-shadow: none; animation: none;
    border-left: 1.5px solid #30d158; border-bottom: 1.5px solid #30d158; transform: rotate(-45deg) translate(1px,-1px); }
  .mini-hint { right: 8px; opacity: 0; transform: translateY(-3px); transition: opacity .2s, transform .24s var(--ease); }
  .mini-view:is(:hover,.hot) .mini-hint, .mini-view:focus-visible .mini-hint { opacity: 1; transform: none; }
  .mini-point { position: absolute; width: 24px; height: 24px; margin: -12px; border: 1px solid rgba(10,132,255,.8);
    border-radius: 50%; background: rgba(10,132,255,.18); box-shadow: 0 0 14px rgba(10,132,255,.3); pointer-events: none; animation: mini-ripple .8s var(--ease) both; }
  .mini-point.scroll { width: 44px; height: 16px; margin: -8px -22px; border: 0; border-radius: 8px;
    background: linear-gradient(transparent, rgba(10,132,255,.45), transparent); animation: mini-scroll .65s var(--ease) both; }
  .mini-point.type { width: 2px; height: 18px; margin: -9px -1px; border: 0; border-radius: 1px; background: #0a84ff; animation: mini-caret .8s var(--ease) both; }
  @keyframes mini-ripple { from { opacity: .9; transform: scale(.5); } to { opacity: 0; transform: scale(1.8); } }
  @keyframes mini-scroll { from { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } to { opacity: 0; transform: translate(var(--dx),var(--dy)); } }
  @keyframes mini-caret { 0%, 100% { opacity: 0; } 30%, 65% { opacity: .9; } }

  .a { margin-top: 16px; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; cursor: copy; }
  .a:empty { display: none; }
  /* light Markdown and TeX math in answers (built as DOM nodes, never HTML from the model) */
  .a :where(p, ul, ol, .h) { margin: 0; } .a > :not(.w) + :not(.w) { margin-top: 14px; }
  .a > .h:not(:first-child) { margin-top: 24px; } .a > .h + :not(.w) { margin-top: 6px; }   /* a section heading sits with the text it heads */
  .a :is(ul, ol) { padding-left: 22px; } .a li { padding-left: 6px; } .a li + li { margin-top: 6px; } .a li::marker { color: var(--fg2); }
  .a .h { font-size: 12px; font-weight: 700; line-height: 1.4; letter-spacing: .06em; text-transform: uppercase; color: #fff; } .a strong { font-weight: 600; color: #fff; }
  .a pre { margin: 0; padding: 10px 12px; border-radius: 10px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, Menlo, monospace; background: rgba(255,255,255,.07); }
  .a .table { overflow-x: auto; } .a table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.45; }
  .a :is(th, td) { padding: 6px 12px 6px 0; text-align: left; vertical-align: top; overflow-wrap: break-word; border-bottom: .5px solid rgba(255,255,255,.1); }
  .a th { font-size: 11.5px; font-weight: 600; color: var(--fg2); } .a tr:last-child td { border-bottom: 0; }
  .a hr { border: 0; border-top: .5px solid rgba(255,255,255,.14); }
  .a code { padding: 1px 5px; border-radius: 5px; font: 13px ui-monospace, Menlo, monospace; background: rgba(255,255,255,.1); }
  .a a, .agent-card a { color: #64d2ff; text-decoration: none; cursor: pointer; } .a a:is(:hover,.hot), .agent-card a:is(:hover,.hot) { text-decoration: underline; }
  .a math { font-family: "STIX Two Math", math; font-size: 1.12em; } .a :is(math, .tex), .turn > .a :is(li, pre, code, th, td) { animation: word .5s var(--ease) both; }
  .a math[display=block] { margin: 12px 0; padding: 2px 0; overflow-x: auto; overflow-y: hidden; }
  .a math::-webkit-scrollbar { height: 0; }
  .tex { font: 13px ui-monospace, Menlo, monospace; color: #e5e5ea; } .tex.block { display: block; margin: 6px 0; text-align: center; }
  .a.agent-ack { display:flex; align-items:flex-start; gap:7px; }
  .agent-ack canvas { width:24px; height:24px; margin:0; }
  .agent-ack span { min-width:0; flex:1; }
  .a .w { display: inline-block; animation: word .5s var(--ease) both; }
  .a.cancel { color: var(--fg2); font-size: 12.5px; }
  .a.stopped { display: flex; align-items: center; gap: 8px; color: var(--fg2); font-size: 12.5px; line-height: 16px; letter-spacing: .1px; }
  .a:is(.stopped, .agent-ack) > :not(.w) + :not(.w) { margin-top: 0; }   /* the answer spacing rule pushed the label below its dot or orb */
  .a.stopped i { flex: none; width: 7px; height: 7px; border-radius: 2px; background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.6);
    animation: in .35s var(--spring) both; }
  .step.cut { color: var(--fg2); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.2); }

  #x { position: relative; flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid;
    place-items: center; opacity: .7;
    background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.30), rgba(255,255,255,.07) 55%, rgba(255,255,255,.03));
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.35), inset 0 -1.5px 2px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.22);
    transition: transform .45s var(--spring), opacity .25s, box-shadow .3s, background .3s; }
  #x svg { width: 8px; height: 8px; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; transition: transform .45s var(--spring); }
  #x.hot { transform: scale(1.28); opacity: 1;
    background: radial-gradient(120% 120% at 30% 15%, rgba(255,255,255,.5), rgba(255,255,255,.14) 55%, rgba(255,255,255,.06));
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55), inset 0 -1.5px 3px rgba(0,0,0,.3), 0 0 0 4px rgba(255,255,255,.05),
      0 4px 14px rgba(0,0,0,.35); }
  #x.hot svg { transform: rotate(90deg); }

  /* safe mode: Atticus asks before it deletes, sends or buys */
  .ok { margin-top: 14px; padding: 13px 14px 14px; border-radius: 14px; background: rgba(255,255,255,.07); cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); animation: grow .32s var(--spring) both; overflow: hidden; max-height: 320px;
    transition: max-height .34s var(--ease), opacity .25s, margin .34s var(--ease), padding .34s var(--ease), background .2s; }
  .ok:is(:hover,.hot) { background: rgba(255,255,255,.09); }
  .ok.gone { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; }
  .ok b { display: block; font-size: 13.5px; font-weight: 600; }
  .ok code { display: block; margin-top: 4px; font: 11px/15px ui-monospace, Menlo, monospace; color: var(--fg2); max-height: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: max-height .34s var(--ease), color .2s; }
  .ok code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok code.full { max-height: 165px; overflow-y: auto; color: #d1d1d6; }
  .ok code::-webkit-scrollbar { width: 0; }
  .ok div { display: flex; gap: 8px; margin-top: 11px; }
  .ok button, .pk .bar button, .rewrite button { flex: 1; height: 28px; border: 0; border-radius: 14px; font: 500 12.5px -apple-system, system-ui, sans-serif; color: #fff;
    cursor: pointer; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.16); transition: transform .3s var(--spring), background .2s; }
  .ok button.go, .pk .bar button.go, .rewrite button.go { background: var(--accent); box-shadow: none; }
  .ok button:is(:hover,.hot), .pk .bar button:is(:hover,.hot), .rewrite button:not(:disabled):is(:hover,.hot) { transform: scale(1.03); } .ok button:active, .pk .bar button:active, .rewrite button:not(:disabled):active { transform: scale(.96); }

  /* "which one?": the AI isn't sure, so it shows its choices. Click one to see it big; click outside it for all of them again */
  .pk { margin-top: 14px; padding: 13px 14px 14px; border-radius: 14px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14);
    animation: grow .32s var(--spring) both; overflow: hidden; max-height: 900px; cursor: default;
    transition: max-height .34s var(--ease), opacity .25s, margin .34s var(--ease), padding .34s var(--ease); }
  .pk.gone { max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; padding-bottom: 0; }
  .pk > b { display: block; margin-bottom: 10px; font-size: 13.5px; font-weight: 600; }
  .pk :is(b, .n) > p { margin: 0; }
  .pk .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .pk .g.list { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  /* many choices scroll inside the card, so the question and buttons stay in view on any display; the padding keeps the hover lift unclipped */

  .a.draft { white-space: pre-wrap; }

  /* resize: drag the bottom-right corner */

  @keyframes grow { from { opacity: 0; transform: translateY(-6px) scale(.97); } }

  button:focus-visible { outline: 2px solid #64d2ff; outline-offset: 3px; }
  /* agents: a quiet badge in the header, count + live dot; it opens the Agent view */

  #agents-pill.attention i { background:#ff9f0a; box-shadow:0 0 6px rgba(255,159,10,.8); }
  /* keycap actions (Raycast-style): label + the key that does it; one blue main action */

  kbd { min-width:20px; height:18px; padding:0 5px; box-sizing:border-box; border-radius:5px; display:inline-grid; place-items:center; font:500 10.5px system-ui;
    color:#f5f5f7; background:rgba(255,255,255,.1); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16), 0 1px 0 rgba(0,0,0,.3); }

  .agent-card .usage { color:var(--fg2); font-size:10px; margin-top:9px; font-variant-numeric:tabular-nums; }

    background:rgba(255,255,255,.06); font-weight:400; } .agent-card .made button:is(:hover,.hot) { transform:none; background:rgba(255,255,255,.1); } .agent-card .made button:is(:hover,.hot) small { color:#e5e5ea; }

  .agent-card .made b { font-size:12.5px; font-weight:600; } .agent-card .made small { margin-top:1px; font-size:10.5px; color:var(--fg2); }

  /* the agent's answer leads the done card, read like any answer; long ones scroll inside so its actions stay in view */

      pill('said').append(go, x); fit(false);
    },
    line(l) {
      const tag = l[0], s = l.slice(2);
      let top = null;   // a streamed answer: the box keeps its start in view and never chases the bottom
      if (tag !== '…' && tag !== '✓') unstream();
      if (tag === '…') {   // the answer as it arrives; ✓ replaces it
        const a = part('a'); if (a && !a.dataset.answer) { clockBegin(); if (!s) unstream(); else { reveal(a, shut(s.replace(/\u2028/g, '\n').replace(/\S+$/, '')), a.classList.contains('streaming')); a.classList.add('streaming'); top = a; } }   // its last word may still be arriving
      }
      else if (tag === '▣') { try { miniUpdate(JSON.parse(s)); } catch {} }
      else if (tag === '@') miniPoint(s);
      else if (tag === '·') status(s, true);
      else if (tag === '▸') {
        clockBegin();   // speculative and instant work can arrive before native calls think()
        settle();
        const st = part('steps'), last = st.lastElementChild, verb = t => t.split(/[\s→]/)[0];
        if (last?.classList.contains('step') && verb(last.textContent) === verb(s)) { last.classList.add('live'); last.firstChild.textContent = s; }   // the same kind of step again (scroll, scroll): one row that updates, not a list
        else {
        const positions = mini?.classList.contains('on') && !reduced.matches ? new Map([...st.children].map(e => [e, {top:e.getBoundingClientRect().top,opacity:+getComputedStyle(e).opacity}])) : null;
        if (positions) for(const e of positions.keys())e.getAnimations().forEach(a=>a.cancel());
        const d = document.createElement('div'); d.className = 'step live'; d.innerHTML = '<span></span>'; d.firstChild.textContent = s;
        st.append(d);
        while (st.children.length > 4) { st.firstChild.remove(); st.dataset.more = (+st.dataset.more || 0) + 1; }   // long tasks: a quiet count, not a wall of steps
        if (positions) for (const e of st.children) e.animate([{transform:`translateY(${positions.has(e) ? positions.get(e).top - e.getBoundingClientRect().top : 19}px)`,opacity:positions.get(e)?.opacity??0},{transform:'none',opacity:1}],{duration:350,easing:'cubic-bezier(.2,.8,.2,1)'});
        }
        status(s, true);
        setState(/^(Searching|Reading|Looking|Taking|Checking|Finding|Waiting)/.test(s) ? 'searching' : /^(Moving|Opening|Using|Clicking|Scrolling|Pressing|Dragging|Typing)/.test(s) ? 'working' : 'connecting');
      } else if (tag === '✓') {
        miniFinish(); clockStop();
        working = false;
        settle(); part('q')?.classList.remove('live'); status('');
        const a = part('a'); if (a) { const shown = a.classList.contains('streaming'); a.classList.remove('streaming'); a.dataset.answer = s; reveal(a, s, shown); if (shown) top = a; } setState('breathing');   // words already on screen do not fade in again
        document.querySelectorAll('.redo').forEach(e => e.remove());   // only the latest answer offers it
        const q = part('q')?.textContent.trim();
        if (q && clock?.closest('.turn') === turn()) {   // "That's wrong" also drops a learned shortcut that did the wrong thing
          const b = document.createElement('button'); b.className = 'redo'; b.textContent = 'Try again';
          b.onclick = e => { e.stopPropagation(); b.remove(); post({ send: `That's wrong, try again: ${q}\n(If it isn't clear what to change, ask me what was wrong.)` }); };
          clock.append(b);
        }
      } else if (tag === '✎' && turn()) { try { receipt(JSON.parse(s)); } catch {}
      } else if (tag === 'i' && turn()) {
        const learned = s.startsWith('Learned: '), kofi = s.startsWith('Support: '), d = document.createElement('div');   // "Learned" when it saved a rule, the Ko-fi line, else "Tip"
        d.className = 'tip' + (learned ? ' learned' : kofi ? ' kofi' : ''); d.dataset.k = learned ? 'Learned' : kofi ? '♥' : 'Tip'; d.textContent = learned || kofi ? s.slice(9) : s;
        if (kofi) { const b = document.createElement('button'); b.className = 'support'; b.textContent = d.textContent; d.replaceChildren(b); b.onclick = () => { post({ kofi: true }); d.remove(); fit(); }; }
        if (!learned) { const o = document.createElement('button'); o.className = 'off'; o.textContent = kofi ? 'Turn off' : 'Turn off tips'; d.append(o); }
        turn().append(d);
        setTimeout(() => { d.classList.add('gone'); setTimeout(() => { d.remove(); fit(); }, 400); }, 9000);   // never sticks around
      }
      fit(!top);
      if (!folded && top && atBottom) {   // grow down to the answer's start, never past it or past where the user scrolled; once it is full they scroll on
        const t = $('thread'), end = t.scrollHeight - t.clientHeight, start = top.getBoundingClientRect().top - t.getBoundingClientRect().top + t.scrollTop - 16;
        t.scrollTop = Math.max(t.scrollTop, Math.min(end, start)); atBottom = start >= end;
      }
    },
    msg(s) {
      if (document.body.classList.contains('dictate')) return window.ui.dictated({ text: s });   // its status line and answer are hidden
      miniFinish(false); clockStop();
      listening = false; working = false; settle(); part('q')?.classList.remove('live'); setState('breathing'); status('');
      document.body.classList.remove('hearing'); boost = 1; $('orb').style.transform = '';   // a quiet end can come straight from listening
      if (part('q')?.classList.contains('empty')) { turn().remove(); status(s); }
      else { const a = part('a'); if (a) { a.className = 'a cancel'; a.textContent = s; } }
      fit();
    },
    stopped(s) {   // Esc or the hotkey cut it off
      miniClear(); clockStop();
      listening = false;
      document.body.classList.remove('hearing');
      working = false;
      $('thread').querySelectorAll('.ok, .pk, .rewrite').forEach(e => e.remove());
      turn()?.querySelectorAll('.step.live').forEach(e => { e.classList.remove('live'); e.classList.add('cut'); });
      setState('breathing'); status(''); boost = 1; $('orb').style.transform = '';
      const q = part('q');
      if (!q || q.classList.contains('empty')) { turn()?.remove(); status(s); return fit(); }
      q.classList.remove('live');
      const a = part('a'); a.className = 'a stopped'; a.innerHTML = '<i></i><span></span>'; a.lastChild.textContent = s;
      fit();
    },
    hover(on) {   // the mouse came over the box: the typing box grows in; left with nothing typed: it goes
      hover = on;
      if (on) comp(true);   // even while listening: the mic keeps going until the user clicks in
      else if (!on && !$('ask').value && document.activeElement !== $('ask')) comp(false);
    },
    compose(on) { comp(on, on); },
    draft(t) { $('ask').value = t; comp(true, true); },
    tap([x, y]) {   // a click on the box, not a drag: on the answer = copy it, anywhere else = type
      const el = document.elementFromPoint(x, y), b = el?.closest('a[href], .ok button, .ok, .pk button, .pk, .rewrite button, .mini-view, .mem-i, .mem-h, .mem, .shot, #pointbar button, .redo, #fold, #agents-pill, .dn button, .tip .support');
      const field = el?.closest('.ok input, .ok textarea, .pk input, .pk textarea');   // "Something else…": a text field in a card takes the cursor
      if (field) return field.focus();
      if (b) return b.click();
      if (folded) return;
      if (document.body.classList.contains('dictate')) return;   // the pill has no typing box: only its buttons act
      if (el?.closest('#mode')) return enableSafeMode();
      if ($('comp').classList.contains('pick')) pickRow(false);   // a click anywhere else closes the model row
      if (el?.closest('.tip .off')) { const k = el.closest('.tip.kofi') ? 'support' : 'tips'; post({ off: k }); el.closest('.tip').remove(); status(k === 'tips' ? 'Tips off · The menu bar turns them back on' : 'Tip reminders off · Settings → About turns them back on'); return fit(); }   // its own "Turn off": no more of that kind
      if (el?.closest('.tip.kofi')) post({ kofi: true });   // the support line opens Ko-fi, then goes like any tip
      if (el?.closest('.tip')) { el.closest('.tip').remove(); return fit(); }   // click a tip: it goes
      const on = el?.closest('.a:not(.stopped):not(.cancel)'), q = el?.closest('.q:not(.empty)');
      drop();
      if (on?.dataset.answer) post({ copy: on.dataset.answer });
      else { if (q) $('ask').value = q.textContent; comp(true, true); }
    },   // typing mode's shortcut: open and put the cursor in it
    size(h) { $('thread').style.maxHeight = h + 'px'; fit(); },
    hold(h) {   // pin the panel to the pointer while an edge is being dragged
      const c = $('card'), t = $('thread');
      h = Math.min(h, parseFloat(c.style.getPropertyValue('--screen-height')) || h);
      c.classList.add('held'); c.style.minHeight = '';
      const chrome = c.offsetHeight - t.offsetHeight;   // header, current composer and live CSS spacing
      t.style.maxHeight = Math.max(60, h - chrome) + 'px';
      c.style.minHeight = h + 'px'; post({ boxH: parseFloat(t.style.maxHeight) }); fit(false);
    },
    resizeDone() { const c = $('card'); c.classList.remove('held'); c.style.minHeight = ''; fit(); },
    pickHear(w) {   // the shortcut over a choices card: it steps aside for the Listening… bubble (w: the words so far); no w: it comes back as it was
      const d = $('thread').querySelector('.pk:not(.gone)'); let q = $('thread').querySelector('.q.reply');
      if (w === undefined) {
        if (!q) return;
        q.remove(); listening = false; document.body.classList.remove('hearing'); boost = 1; $('orb').style.transform = '';
        if (d) { d.hidden = false; setState('breathing'); status('Waiting for you'); }   // gone: it expired while hidden
        return fit();
      }
      if (!d) return;
      if (!q && listening) return window.ui.draft(w);   // a hands-free follow-up already shows its own turn
      if (!q) { q = document.createElement('div'); q.className = 'q live hear reply'; d.before(q); d.hidden = true; comp(false); listening = true; document.body.classList.add('hearing'); setState('listening'); status('Listening…', true); }
      q.classList.toggle('empty', !w.trim()); q.textContent = w; fit();
    },
    respond(text) {
      const o = $('thread').querySelector('.pk:not(.gone) .other');   // a choices card: the main box works like its "Something else" field
      if (o) { window.ui.pickHear(); $('ask').value = ''; o.value = text; o.onkeydown({ key: 'Enter', preventDefault() {} }); return true; }
      const d = $('thread').querySelector('.ok.retry:not(.gone)');
      if (!d) return false;
      const t = text.toLowerCase().replace(/[.!?,]+/g, ' ').replace(/^\s*(?:um+|uh+|okay|ok|yeah|so)\s+/, '').replace(/\s+please\s*$/, '').replace(/\s+/g, ' ').trim();   // "Retry, please." = retry
      const value = ['retry', 'try again', 'yes'].includes(t) ? 'r' : ['not now', 'no', 'cancel'].includes(t) ? 'n' : '';
      const button=d.querySelector(`[data-answer="${value}"]`);
      if(button){$('ask').value='';button.click();}
      else { $('ask').value = text; status('Say “Retry” or “Not now”', true); }   // heard, but not an answer
      return true;
    },
    notice(s) { status(s, true); },
    ask([q, cmd, retry, details]) {   // retry: a failure card (Not now / Retry) instead of an approval
      $('thread').querySelectorAll('.ok').forEach(e => e.remove()); unpin(); unstream();
      const d = document.createElement('div'); d.className = 'ok';
      if (retry) {
        d.className = 'ok offer retry';
        d.innerHTML = '<b></b><p></p><div><button data-answer="n">Not now</button><button data-answer="r" class="go">Retry</button></div>' +
          (details ? '<button class="details">Copy Details</button>' : '');
        d.querySelector('p').textContent = cmd;
      } else {
        d.innerHTML = '<b></b><code></code><div><button>Don’t Allow</button><button class="go">Allow</button></div>';
        d.querySelector('code').textContent = cmd;
        const c = d.querySelector('code');
        d.onclick = () => {   // the whole command: grows open, click again to fold it back
          if (c.classList.toggle('full')) c.classList.add('wrap'); else setTimeout(() => c.classList.contains('full') || c.classList.remove('wrap'), 340);
          follow(360);
        };
      }
      d.querySelector('b').textContent = q;
      d.onanimationend = () => d.style.animation = 'none';   // so the shrink below can transition
      const detailsBtn = d.querySelector('.details');
      if (detailsBtn) detailsBtn.onclick = e => { e.stopPropagation(); post({ copy: details }); };
      d.querySelectorAll(':scope > div > button').forEach((b, i) => b.onclick = e => {
        e.stopPropagation(); if (d.classList.contains('gone')) return;
        post(retry ? { pick: b.dataset.answer } : { allow: !!i }); clockGo(); status(retry ? (i ? 'Trying again' : 'Not now') : i ? 'Allowed' : 'Not allowed', true); setState('solving');
        d.classList.add('gone'); follow(360); setTimeout(() => { d.remove(); fit(); refoldIfAsked(); }, 360);
      });
      (turn() || $('thread')).append(d); setState('breathing'); status('Waiting for you'); clockHold(); unfoldForAnswer(focusAnswer); fit();
      setTimeout(() => {
        if (!d.isConnected || d.classList.contains('gone')) return;
        post(retry ? { pick: 'n' } : { allow: false }); clockGo(); d.remove(); status(retry ? 'Offer expired' : 'Approval expired', true); setState('solving'); fit(); refoldIfAsked();
      }, 60000);
    },
    improve() {   // once, after a task that worked: people who updated never saw setup's question
      $('thread').querySelectorAll('.ok.improve').forEach(e => e.remove());
      const d = document.createElement('div'); d.className = 'ok offer improve';
      d.innerHTML = '<b>Help make Atticus better?</b><p>When a task fails, send what you asked, the steps and why. Anonymous, cleaned first. Change it in Settings.</p><div><button>Not Now</button><button class="go">Help Improve</button></div>';
      d.querySelectorAll(':scope > div > button').forEach((b, i) => b.onclick = e => {
        e.stopPropagation(); if (d.classList.contains('gone')) return;
        post({ improve: !!i }); status(i ? 'Thank you' : '', true);
        d.classList.add('gone'); follow(360); setTimeout(() => { d.remove(); fit(); }, 360);
      });
      d.onanimationend = () => d.style.animation = 'none';
      (turn() || $('thread')).append(d); fit();
    },
    pick({ q, options }) {   // "which one?": the index picked (or "" = none of these) goes back to the app, then the card goes
      $('thread').querySelectorAll('.pk').forEach(e => e.remove()); unstream();
      const d = document.createElement('div'); d.className = 'pk';
      d.innerHTML = '<b></b><div class="g"></div><input class="other" placeholder="Something else…" aria-label="Something else: type or dictate, then press Return"><div class="bar"><button class="none">None of these</button><button class="back">All choices</button><button class="go">Use this</button></div>';
      d.querySelector('b').append(markdown(q));
      const g = d.querySelector('.g'), pics = options.some(o => o.img);
      g.classList.toggle('list', !pics);   // nothing to preview (songs, people): one click picks
      let on = null;
      const view = c => { on?.classList.remove('on'); on = c; c?.classList.add('on'); d.classList.toggle('open', !!c); follow(360); };
      const done = (i, s, own) => {   // own: what the user typed instead of a choice ("=" marks it, so "2" stays text)
        if (d.classList.contains('gone')) return;
        post({ pick: own ? '=' + own : i < 0 ? '' : String(i) }); clockGo();
        if ((own || i >= 0) && part('steps')) {
          const st = document.createElement('div'); st.className = 'step done'; st.innerHTML = '<span></span>';
          st.firstChild.textContent = own ? 'You said: ' + own : 'Picked ' + options[i].label; part('steps').append(st);
        }
        status(s || (i < 0 ? 'None of these' : 'Picked'), true); setState('solving');
        d.classList.add('gone'); follow(360); setTimeout(() => { d.remove(); fit(); refoldIfAsked(); }, 360);
      };
      options.forEach((o, i) => {
        const c = document.createElement('button'); c.className = 'c'; c.style.animationDelay = i * 35 + 'ms';
        c.innerHTML = (pics ? '<div class="th"></div>' : '') + '<div class="n"></div><div class="s"></div><div class="p"></div>';
        if (pics && o.img) { const im = new Image(); im.alt = ''; im.draggable = false; im.onload = () => fit(); im.src = o.img; c.firstChild.append(im); }
        else if (pics) c.firstChild.textContent = o.kind || '';   // no preview: its file type
        c.querySelector('.n').append(markdown(o.label)); c.querySelector('.s').textContent = o.sub; c.querySelector('.p').textContent = o.path || '';
        c.title = o.path ? o.path + '/' + o.label : o.label; if (i < 9) c.setAttribute('aria-keyshortcuts', String(i + 1));   // long titles clip to two lines; hover shows all
        c.choose = () => done(i);
        c.onclick = e => { e.stopPropagation(); if (!pics) done(i); else view(on === c ? null : c); };
        g.append(c);
      });
      d.onclick = () => view(null);   // a click outside the big one: all the choices again
      d.onkeydown = e => {   // 1-9 picks, arrows move between choices, Return presses the focused one
        if (e.target.matches('input') || e.metaKey || e.ctrlKey || e.altKey) return;
        const cs = [...g.children], at = cs.indexOf(document.activeElement);
        if (/^[1-9]$/.test(e.key) && cs[e.key - 1]) { e.preventDefault(); cs[e.key - 1].choose(); }
        else if (e.key === 'Enter' && on && !e.isComposing && !e.target.closest('button,textarea,select,a,[contenteditable=true]')) { e.preventDefault(); go.click(); }   // a file grown big: Return uses it
        else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cs[Math.max(0, Math.min(cs.length - 1, at < 0 ? 0 : at + (e.key === 'ArrowDown' ? 1 : -1)))].focus(); }
      };
      d.onanimationend = e => { if (e.target === d) d.style.animation = 'none'; };   // so the shrink can transition
      const other = d.querySelector('.other');
      other.onclick = e => e.stopPropagation();
      other.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing && other.value.trim()) { e.preventDefault(); done(-1, 'Got it', other.value.trim().slice(0, 300)); } };
      const [none, back, go] = d.querySelectorAll('.bar button');
      none.onclick = e => { e.stopPropagation(); done(-1); };
      back.onclick = e => { e.stopPropagation(); view(null); };
      go.onclick = e => { e.stopPropagation(); done([...g.children].indexOf(on)); };
      (turn() || $('thread')).append(d); setState('breathing'); status('Waiting for you'); clockHold(); unfoldForAnswer(focusAnswer); fit();
      setTimeout(() => d.isConnected && done(-1, 'Pick expired'), 105000);   // the brain stops waiting at 110 s
    },
    mode(safe) { $('mode').classList.toggle('on', !safe); },
    models({ list, pick }) {   // Claude's models, or the custom server's; none for a client without a choice
      const name = v => ({cheapest: 'Cheapest', balanced: 'Balanced', capable: 'Most capable'})[v] || (/^(haiku|sonnet|opus)$/.test(v) ? v[0].toUpperCase() + v.slice(1) : v);
      $('model').hidden = !list.length; $('model').textContent = name(pick);
      $('models').replaceChildren(...list.map(v => { const b = document.createElement('button'); b.dataset.v = v; b.textContent = name(v); b.classList.toggle('on', v === pick); b.setAttribute('role', 'menuitemradio'); b.setAttribute('aria-checked', v === pick); return b; }));
      spread();
    },
    pointer(p, x) {   // native's mouse tracking: .hot is the :hover chain under the point (x: on the ×'s corner); returns whether the cursor is a hand
      const m = x ? $('x') : p.length ? document.elementFromPoint(p[0], p[1]) : null, now = [];
      for (let e = m; e; e = e.parentElement) now.push(e);
      hot.forEach(e => now.includes(e) || e.classList.remove('hot')); now.forEach(e => e.classList.add('hot')); hot = now;
      return !!x || !!m && getComputedStyle(m).cursor === 'pointer';
    },
    copied() { status('Copied to clipboard'); setTimeout(() => $('status').textContent === 'Copied to clipboard' && status(''), 1400); },
  };
  fit(); post({ ready: 1 });
</script>
</body></html>
