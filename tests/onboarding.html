<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Onboarding checks</title><style>body{font:14px system-ui;margin:24px}iframe{width:640px;height:612px;border:0}.pass{color:green}.fail{color:red}pre{white-space:pre-wrap}</style></head><body><pre id="results">Running…</pre><iframe id="preview" title="Onboarding"></iframe><iframe id="reduced" title="Reduced motion"></iframe>
<script type="module">
const results=document.getElementById('results'),checks=[],messages=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async(test,name,timeout=10000)=>{const end=performance.now()+timeout;while(!test()){if(performance.now()>end)throw Error('Timed out waiting for '+name);await wait(10)}};
const assert=(ok,name)=>{if(!ok)throw Error(name);checks.push('✓ '+name)};
try{
const html=await(await fetch('../ui/onboarding.html')).text(),orbs=await(await fetch('../ui/orbs.js')).text(),i18n=await(await fetch('../ui/i18n.js')).text();
async function load(id,reduce){
 const f=document.getElementById(id),bridge=`<style>*,*::before,*::after{transition:none!important;transition-delay:0s!important}:not(#done-check *),:not(#done-check *)::before,:not(#done-check *)::after{animation:none!important}</style><script>const media=window.matchMedia;window.matchMedia=q=>q.includes('prefers-reduced-motion')?{matches:${reduce},addEventListener(){},removeEventListener(){}}:media(q);window.framesRequested=0;const raf=window.requestAnimationFrame;window.requestAnimationFrame=f=>{framesRequested++;return raf(f)};window.webkit={messageHandlers:{ob:{postMessage:m=>parent.postMessage(m,'*')}}};<\/script>`;
 f.srcdoc=html.replace('/*ORBS*/',()=>orbs).replace('/*I18N*/',()=>i18n).replace('<head>','<head>'+bridge);
 await until(()=>!!f.contentWindow.ob&&f.contentWindow.document.readyState==='complete','Onboarding initializes '+id);
 assert(!!f.contentWindow.ob,'Onboarding initializes '+id);return f.contentWindow;
}
window.addEventListener('message',e=>messages.push(e.data));
const w=await load('preview',false),d=w.document,$=id=>d.getElementById(id);
w.i18n.setLanguage('it');
assert(d.querySelector('#welcome h1').textContent==='Scopri Atticus' && d.querySelector('#p-mic b').textContent==='Microfono','Italian setup includes JS permission labels');
w.i18n.setLanguage('en');
function page(id){
 const active=d.querySelector('.page.on');assert(active.id===id,'Page '+id+' is active');
 for(const p of d.querySelectorAll('.page'))assert(p.inert===(p!==active)&&p.getAttribute('aria-hidden')===String(p!==active),'Accessible state '+id+' / '+p.id);
}
async function go(id){d.querySelector(`.page.on [data-go="${id}"]`).click();await until(()=>d.querySelector('.page.on')?.id===id,'page '+id);page(id);
 const p=$(id),top=p.getBoundingClientRect().top-p.scrollTop;   // tall pages scroll: every child sits inside the page's scroll range, never squeezed out of it
 for(const e of p.children){const r=e.getBoundingClientRect();if(!e.hidden)assert(r.left>=0&&r.right<=640&&r.top>=top&&r.bottom<=top+p.scrollHeight,'Fits window '+id+' / '+(e.id||e.tagName))}
}
page('welcome');await go('perms');
w.ob.plan({ok:false,need:'upgrade',client:'claude',text:'Atticus needs a paid Claude plan (Pro or Max).'});w.ob.server({apiBase:'',apiModel:''});assert($('client-alt').textContent==='Change provider','Plan row offers Change provider');
$('client-alt').click();await until(()=>!$('prov').hidden,'provider sheet');assert(d.querySelector('.opt[data-p="claude"]').getAttribute('aria-checked')==='true'&&$('srv').hidden,'Sheet opens on the current provider');
for(const e of [d.querySelector('#prov .card')]){const r=e.getBoundingClientRect();assert(r.top>=0&&r.bottom<=612&&r.left>=0&&r.right<=640,'Provider sheet fits window')}
w.ob.local([{name:'Ollama',base:'http://localhost:11434',models:['qwen3']}]);assert(!$('local-offer').hidden&&$('local-use').textContent==='Use Ollama','Running local server is offered');
$('local-use').click();assert(!$('srv').hidden&&$('srv-base').value==='http://localhost:11434'&&$('srv-model').value==='qwen3'&&!$('prov-use').disabled,'Local offer fills its address and model');
$('srv-base').value='';$('srv-model').value='';
d.querySelector('.opt[data-p="server"]').click();assert(!$('srv').hidden&&$('prov-use').disabled,'Custom server needs an address and model');
d.querySelector('.chip[data-base="http://localhost:11434"]').click();await until(()=>messages.some(m=>m.do==='probe'&&m.base==='http://localhost:11434'),'server probe');assert(true,'Ollama quick fill asks the server for models');
w.ob.models(['qwen3','llama4']);assert($('srv-model').value==='qwen3'&&!$('prov-use').disabled&&$('srv-note').textContent.includes('Found 2'),'Found models fill the Model box');
$('prov-use').click();await until(()=>$('prov').hidden&&messages.some(m=>m.do==='provider'&&m.client==='claude'&&m.apiBase==='http://localhost:11434'&&m.apiModel==='qwen3'&&m.apiKey===''),'server choice to save');assert(true,'Use This Server saves it and closes');
w.ob.plan({ok:false,need:'upgrade',client:'claude',text:'old Claude check'});assert(!$('p-claude').textContent.includes('old Claude check'),'A stale check for the old provider is ignored');
w.ob.plan({ok:false,need:'install',client:'server',text:'Custom servers run through Claude Code.'});assert($('p-claude').querySelector('.txt b').textContent==='Custom Server'&&$('p-claude').querySelector('.allow').textContent==='Install','Server row offers to install Claude Code');
$('client-alt').click();await until(()=>!$('prov').hidden,'provider sheet for Devin');d.querySelector('.opt[data-p="devin"]').click();assert($('prov-use').textContent==='Use Devin','Devin choice');
$('prov').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await until(()=>$('prov').hidden,'provider sheet to close');assert(!messages.some(m=>m.do==='provider'&&m.client==='devin'),'Escape cancels without saving');
$('client-alt').click();await until(()=>!$('prov').hidden,'provider sheet for Pi');d.querySelector('.opt[data-p="pi"]').click();assert($('prov-use').textContent==='Use Pi','Pi choice');$('prov-use').click();await until(()=>messages.some(m=>m.do==='provider'&&m.client==='pi'),'Pi choice to save');assert(true,'Pi choice is saved');
w.ob.plan({ok:true,need:'',client:'pi',text:'Pi is installed.'});assert($('p-claude').querySelector('.txt b').textContent==='Pi','Pi plan status is shown');
w.ob.plan({ok:true,need:'',client:'server',text:'Using a custom server.'});await go('agents');
await until(()=>messages.some(m=>m.do==='connectors'),'connector status request');assert(true,'Agents step asks for connector status');
w.ob.set({mic:true,speech:true,ax:true,screen:false,auto:true,chrome:false,calendar:true,tools:true});w.ob.connectors({connected:['Gmail'],signin:['Notion']});
assert($('a-ax').classList.contains('ok')&&!$('a-screen').classList.contains('ok')&&$('a-connectors').classList.contains('ok')&&$('a-connectors').textContent.includes('1 need sign-in'),'Agents rows show live status, nothing asked twice');
assert(!$('enable').hidden&&$('agents-next').textContent==='Skip for Now','Enable All shows while something is missing');
$('enable').click();await until(()=>messages.some(m=>m.do==='enableAll'&&m.connected==='true'),'Enable All request');assert(true,'Enable All starts the walk');
w.ob.walk('screen');assert($('a-screen').classList.contains('now')&&!$('a-ax').classList.contains('now')&&$('a-screen').textContent.includes('Turn on Atticus in System Settings')&&$('enable').disabled,'Enable All marks the step it is on and says what to do');
w.ob.set({mic:true,speech:true,ax:true,screen:true,auto:true,chrome:true,calendar:true,tools:true});w.ob.walk('');
assert($('enable').hidden&&$('agents-next').textContent==='Continue','All on: Continue is the main action');
await go('try');assert($('try-next').hidden,'Try Next waits for shortcut');
w.ob.tried();await until(()=>!$('try-next').hidden&&$('try-skip').hidden,'Try Next button');assert(true,'Shortcut enables Next');
await go('mac');assert(!!$('mac-mini')&&$('mac').textContent.includes('background'),'Mac preview explains background work and live mini screen');await go('text');await go('dictate');
const P0={draw:true,meeting:false,routing:'balanced',dictateMode:'verbatim',dictateHotkeyLabel:''},keysIn=()=>[...$('dc-field').querySelectorAll('i')].map(i=>i.textContent).join('');
w.ob.prefs(P0);assert($('dc-field').textContent==='Record Shortcut'&&$('dc-clear').hidden&&$('dc-mode').classList.contains('dim'),'Dictation starts with no shortcut and its mode greyed');
$('dc-field').click();await until(()=>messages.some(m=>m.do==='recordDictate')&&$('dc-field').classList.contains('rec'),'dictation recorder');assert($('dc-field').textContent==='Type Shortcut','Clicking the field records the next keys');
w.ob.rec('⌃⌥');assert(keysIn()==='⌃⌥','Held keys show live');w.ob.prefs(P0);assert($('dc-field').classList.contains('rec')&&keysIn()==='⌃⌥','The every-second refresh leaves a recording alone');
w.ob.taken('dictate',false);w.ob.recorded('');assert($('dc-hint').className==='warn'&&$('dc-hint').textContent.includes('Another app')&&$('dc-field').textContent==='Record Shortcut','A clash warns in place and keeps the old shortcut');
$('dc-field').click();await until(()=>$('dc-field').classList.contains('rec'),'dictation re-recording');w.ob.recorded('⌃⌥D');assert(!$('dc-field').classList.contains('rec')&&keysIn()==='⌃⌥D'&&!$('dc-clear').hidden&&!$('dc-mode').classList.contains('dim'),'A recorded shortcut shows its keys, a clear button and its mode');
d.querySelector('#dc-mode [data-v=cleanup]').click();await until(()=>messages.some(m=>m.do==='set'&&m.k==='dictateMode'&&m.v==='cleanup'),'dictation mode save');assert(true,'Dictation mode is saved');
$('dc-clear').click();await until(()=>messages.some(m=>m.do==='clearDictate'),'dictation shortcut clear');assert($('dc-field').textContent==='Record Shortcut','Clear removes the shortcut');
const ex=d.querySelectorAll('#dc-ex button');assert(ex.length===5&&$('dictate').textContent.includes('Scratch that')&&$('dictate').textContent.includes('New line'),'Dictate teaches Clean up by example');
ex[1].click();await until(()=>ex[1].getAttribute('aria-pressed')==='true'&&$('dc-said').textContent.includes('scratch')&&$('dc-said').querySelector('.x'),'chosen dictation example');assert(ex[0].getAttribute('aria-pressed')==='false','Picking an example plays it, with the dropped words marked');
$('dc-field').click();await until(()=>$('dc-field').classList.contains('rec'),'dictation recording');await go('point');await until(()=>messages.some(m=>m.do==='cancelRecord'),'recording cancellation');assert(true,'Leaving mid-recording cancels it');
assert($('point').textContent.includes('whiteboard')&&d.querySelectorAll('#wb-card [data-s]').length===3,'Draw on screen shows the whiteboard explanation');
assert(d.querySelector('[data-k="draw"]').checked&&!d.querySelector('[data-k="meeting"]').checked,'Switches reflect prefs');
d.querySelector('[data-k="draw"]').click();await until(()=>messages.some(m=>m.do==='set'&&m.k==='draw'&&m.v==='false'),'draw preference');assert(true,'Switch sends native preference');
w.ob.plan({ok:true,need:'',client:'pi',text:'Pi is installed.'});d.querySelector('#point [data-go="work"]').click();await until(()=>d.querySelector('.page.on')?.id==='meeting','Pi meeting page');page('meeting');
$('back').click();await until(()=>d.querySelector('.page.on')?.id==='point','point page');page('point');
w.ob.plan({ok:true,need:'',client:'server',text:'Using a custom server.'});w.ob.prefs(P0);await go('work');assert($('wk-brain').hidden,'A custom server hides Intelligence');
w.ob.plan({ok:true,need:'',client:'claude',text:'Signed in.'});w.ob.prefs(P0);
assert(!$('wk-brain').hidden&&$('wk-why').textContent.includes('quick asks')&&d.querySelector('[data-k=routing] [data-v=balanced]').getAttribute('aria-pressed')==='true','Intelligence shows the current mode and why');
d.querySelector('[data-k=routing] [data-v=cheapest]').click();await until(()=>messages.some(m=>m.do==='set'&&m.k==='routing'&&m.v==='cheapest'),'routing preference');assert(!d.querySelector('[data-k=longAsks]'),'Long asks always move: no setting');
assert(messages.some(m=>m.do==='set'&&m.k==='routing'&&m.v==='cheapest')&&$('wk-why').textContent.includes('least'),'Work choices save and explain themselves');
assert($('work').textContent.includes('⌃⌥↩'),'The work page names the move shortcut');
for(const e of $('work').querySelectorAll('.row')){const r=e.getBoundingClientRect();assert(r.right<=640&&r.bottom<=612,'Fits window work / '+e.textContent.slice(0,12))}
await go('meeting');assert($('meeting').textContent.includes('Settings → Meetings')&&!!$('mt-archive'),'Meeting preview includes the local archive');await go('improve');
for(const e of $('improve').children){const r=e.getBoundingClientRect();assert(r.left>=0&&r.right<=640&&r.top>=0&&r.bottom<=612,'Fits window improve / '+e.className)}
assert($('improve').textContent.includes('Anonymous')&&d.querySelector('#improve .bar2 .btn:not(.quiet)').textContent==='Help Improve','Improve page says what is sent; Help Improve is the main action');
d.querySelector('#improve [data-improve="true"]').click();await until(()=>d.querySelector('.page.on')?.id==='tip','tip page');page('tip');
for(const e of $('tip').children){const r=e.getBoundingClientRect();assert(r.left>=0&&r.right<=640&&r.top>=0&&r.bottom<=612,'Fits window tip / '+(e.id||e.className))}
assert($('tip').textContent.includes('really support me')&&$('kofi').textContent.includes('Leave a Tip'),'Tip page asks for a tip on its own screen');
$('kofi').click();await until(()=>messages.some(m=>m.do==='kofi'),'tip request');assert(true,'Leave a Tip opens the tip page');assert(d.querySelector('.page.on').id==='tip','Tipping stays on the tip page');
await go('done');
w.ob.prefs({...P0,dictateHotkeyLabel:'fn⌃⌥⇧⌘Return'});
assert($('ideas').textContent.includes('Convert this JPEG to PNG'),'Things to try includes file conversion');
const ideas=[...d.querySelectorAll('#ideas .idea')].filter(e=>!e.hidden).map(e=>e.firstElementChild.getBoundingClientRect());
assert(ideas.length===15&&$('done').textContent.includes('Be great')&&d.querySelector('.page.on')===$('done')&&$('done')===d.querySelector('.page:last-of-type'),'Setup ends on things to try');
assert(ideas.every((a,i)=>a.left>=0&&a.right<=640&&a.top>=0&&a.bottom<=612&&ideas.every((b,j)=>i===j||a.right<=b.left||b.right<=a.left||a.bottom<=b.top||b.bottom<=a.top)),'Every idea fits and none overlap');
assert($('done').scrollHeight<=$('done').clientHeight,'Last page fits without scrolling');
w.ob.prefs(P0);assert($('idea-dict').hidden,'No dictation shortcut hides its idea');
await until(()=>messages.some(m=>m.do==='set'&&m.k==='improve'&&m.v==='true'),'improve preference');assert(true,'Help Improve turns the setting on');assert($('feedback-note').textContent.includes('Report feedback'),'Last page asks for feedback');$('feedback-link').click();await until(()=>messages.some(m=>m.do==='feedback'),'feedback link message');assert(true,'Its link opens Report feedback');await until(()=>w.getComputedStyle($('done-check').querySelector('circle')).opacity==='1','done check (it only reaches its last frame by animating)');assert(true,'Done check finishes');
const reduced=await load('reduced',true);
await until(()=>reduced.document.getElementById('macstage').classList.contains('snapped')&&reduced.document.getElementById('mt-ans').classList.contains('on')&&reduced.document.getElementById('dc-words').textContent==='I was thinking we could leave.','reduced-motion final previews');
assert(reduced.framesRequested===0,'Reduced Motion renders orb once');
assert(!reduced.document.querySelector('.key.down'),'Reduced Motion stops welcome key loop');
assert(reduced.document.getElementById('macstage').classList.contains('snapped')&&reduced.document.getElementById('mt-ans').classList.contains('on'),'Reduced Motion shows final previews');
assert(reduced.document.getElementById('dc-words').textContent==='I was thinking we could leave.'&&reduced.document.getElementById('wb-card').querySelectorAll('p.on').length===3,'Reduced Motion shows the finished dictation and whiteboard previews');
results.textContent=checks.join('\n')+`\n${checks.length} checks passed.`;results.className='pass';
}catch(e){results.textContent=checks.join('\n')+'\n✗ '+e.message;results.className='fail'}
</script></body></html>
